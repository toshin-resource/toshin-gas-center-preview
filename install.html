<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>関係者限定ページ｜トーシンガスセンター</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --c: #1f3b5a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
         background: #f4f5f7; color: #1f2328; }
  .box { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e2e5e9; border-radius: 12px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 1.15rem; margin: 0 0 6px; font-weight: 700; }
  p { margin: 0 0 20px; font-size: .9rem; color: #586069; line-height: 1.7; }
  input[type=password] { width: 100%; font-size: 1rem; padding: 12px 14px; border: 1px solid #c9ced5; border-radius: 8px; }
  input[type=password]:focus { outline: 3px solid #b86200; outline-offset: 1px; }
  label.remember { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: .85rem; color: #586069; margin: 14px 0 18px; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 999px; background: var(--c); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: wait; }
  .err { color: #b3261e; font-size: .88rem; min-height: 1.4em; margin: 12px 0 0; }
</style>
</head>

  <h1>関係者限定ページ</h1>

    <p class="err" id="err" role="alert"></p>
  </form>
</main>

  var KEYNAME = 'tgc_key_' + D.salt;
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function toB64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function store() { try { return { s: sessionStorage, l: localStorage }; } catch (e) { return null; } }
  async function derive(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, 256);
    return new Uint8Array(bits);
  }
  async function open(raw) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct));
    var html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
    if (location.hash) {
      setTimeout(function () {
        var t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (t) t.scrollIntoView();
      }, 80);
    }
  }
  var st = store();
  var saved = st && (st.s.getItem(KEYNAME) || st.l.getItem(KEYNAME));
  if (saved) {
    // 2ページ目以降：入力画面をいったん隠し、読み込み完了後に自動で表示
    document.querySelector('.box').style.visibility = 'hidden';
    var autoOpen = function () {
      open(b64(saved)).catch(function () {
        st.s.removeItem(KEYNAME); st.l.removeItem(KEYNAME);
        document.querySelector('.box').style.visibility = '';
      });
    };
    if (document.readyState === 'complete') { autoOpen(); } else { window.addEventListener('load', autoOpen, { once: true }); }
  }
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.textContent = '確認しています…';
    try {
      var raw = await derive(document.getElementById('pw').value);
      await open(raw);
      if (st) {
        st.s.setItem(KEYNAME, toB64(raw));
        if (document.getElementById('rm') && document.getElementById('rm').checked) st.l.setItem(KEYNAME, toB64(raw));

      btn.disabled = false; err.textContent = 'パスワードが違います。';
    }
  });
